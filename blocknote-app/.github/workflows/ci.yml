name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: API Tests (Supertest) ─────────────────────────────────────────
  api-tests:
    name: API Tests (Supertest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run API tests
        run: NODE_OPTIONS=--experimental-sqlite npx jest --runInBand --forceExit --testPathPattern="tests/api"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/api/
          if-no-files-found: ignore

  # ─── Job 2: E2E Tests (Playwright) ────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # continue even if some tests fail so the report is always uploaded
        run: NODE_OPTIONS=--experimental-sqlite npx playwright test || true
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/playwright/
          retention-days: 30

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: reports/playwright-results.json
          if-no-files-found: ignore

  # ─── Job 3: Trigger n8n Reporting Workflow ────────────────────────────────
  notify-n8n:
    name: Trigger n8n Report
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: always()

    steps:
      - name: Download Playwright JSON results
        uses: actions/download-artifact@v4
        with:
          name: playwright-json-results
        # If e2e job failed before generating the file this step may fail — continue anyway
        continue-on-error: true

      - name: Send Playwright results to n8n
        run: |
          if [ -f "playwright-results.json" ]; then
            echo "Sending playwright-results.json to n8n..."
            curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d @playwright-results.json
          else
            echo "No playwright-results.json found, sending fallback payload..."
            curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "stats": {
                  "expected": 0,
                  "unexpected": 0,
                  "skipped": 0,
                  "flaky": 0
                },
                "suites": [],
                "errors": ["E2E results file not generated"],
                "meta": {
                  "repository": "${{ github.repository }}",
                  "branch": "${{ github.ref_name }}",
                  "commit": "${{ github.sha }}",
                  "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "api_tests_status": "${{ needs.api-tests.result }}",
                  "e2e_tests_status": "${{ needs.e2e-tests.result }}",
                  "triggered_by": "${{ github.actor }}"
                }
              }'
          fi
